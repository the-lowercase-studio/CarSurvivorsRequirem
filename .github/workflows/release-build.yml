name: Unity Release Build

on:
  workflow_dispatch:
  
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  
jobs:
  await-approval:
    name: Waiting for build approval
    runs-on: ubuntu-latest
    environment: build-approval
    steps:
      - name: Approval received
        run: echo "Build approved, proceeding..."

  build:
    name: Release Build
    needs: await-approval 
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        targetPlatform:
          - StandaloneWindows64
          
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.9f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-6000.3.9f1-
            
      - name: Build Project (Release)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          targetPlatform: ${{ matrix.targetPlatform }}
          
      - name: Get Version
        id: version
        run: echo "version=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT
        
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Release-Build-${{ matrix.targetPlatform }}-${{ steps.version.outputs.version }}
          path: build/${{ matrix.targetPlatform }}/